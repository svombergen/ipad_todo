name: Diary
options:
  developmentLanguage: nl
  bundleIdPrefix: local.kiosk
  deploymentTarget:
    iOS: "15.0"
targets:
  Diary:
    type: application
    platform: iOS
    sources:
      - path: Kiosk/App.swift
      - path: Kiosk/Assets.xcassets
      - path: Kiosk/web
        type: folder # copied as-is to Diary.app/web
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.kiosk.dagboek
        TARGETED_DEVICE_FAMILY: "2"
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Kiosk/Info.plist
      properties:
        CFBundleDisplayName: Dagboek
        CFBundleDevelopmentRegion: nl
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Zoekt naar app-updates op de computer.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true # update check fetches http://<pc>:8000
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
