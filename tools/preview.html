<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview</title>
<style>
  body { margin: 0; background: #1f2937; color: #fff; font: 16px system-ui, sans-serif; height: 100vh; overflow: hidden; }
  .bar { height: 48px; display: flex; gap: 12px; align-items: center; padding: 0 16px; }
  .bar a, .bar button { color: #fff; background: #ffffff22; border: 0; border-radius: 10px; padding: 8px 14px; font: inherit; text-decoration: none; cursor: pointer; }
  #wrap { transform-origin: top left; margin-left: 16px; }
  iframe { border: 0; border-radius: 24px; background: #fff; box-shadow: 0 0 0 12px #000; display: block; }
</style>
<div class="bar"><a href="./">&lsaquo; Terug</a><button id="rot">Draai</button><span id="dim"></span></div>
<div id="wrap"><iframe id="f"></iframe></div>
<script>
  const q = new URLSearchParams(location.search);
  let w = +q.get('w') || 1024, h = +q.get('h') || 768;
  const f = document.getElementById('f'), wrap = document.getElementById('wrap');
  f.src = 'preview/' + (q.get('app') || 'kids') + '/index.html';
  function fit() {
    f.width = w; f.height = h;
    document.getElementById('dim').textContent = w + ' x ' + h;
    const s = Math.min(1, (innerWidth - 48) / w, (innerHeight - 80) / h);
    wrap.style.transform = 'scale(' + s + ')';
  }
  document.getElementById('rot').onclick = () => { [w, h] = [h, w]; fit(); };
  addEventListener('resize', fit);
  fit();
</script>
