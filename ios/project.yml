name: KidsTodo
options:
  developmentLanguage: nl
  bundleIdPrefix: local.kiosk
  deploymentTarget:
    iOS: "15.0"
targets:
  KidsTodo:
    type: application
    platform: iOS
    sources:
      - path: Kiosk/App.swift
      - path: Kiosk/Assets.xcassets
      - path: Kiosk/web
        type: folder # copied as-is to KidsTodo.app/web
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.kiosk.kidstodo
        TARGETED_DEVICE_FAMILY: "2"
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Kiosk/Info.plist
      properties:
        CFBundleDisplayName: Mijn dag
        CFBundleDevelopmentRegion: nl
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
